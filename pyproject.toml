[project]
name = "ai-env"
version = "0.1.0"
description = "Paid data and services for AI agents (draft)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12,<3",
]

[project.scripts]
ai-env = "ai_env:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
